plugins { id 'com.android.application' }

android {
    namespace 'com.hoosha.vcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.hoosha.vcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

// No external dependencies: the Xposed API classes are provided as
// compile-time stubs under de/robv/android/xposed/ and LSPosed supplies
// the real implementations at runtime.
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
